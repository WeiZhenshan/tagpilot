[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagpilot-insight"
version = "0.1.0"
description = "TagPilot 聚合洞察契约、事实 Guard 与确定性图表流水线"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tagpilot-insight = "tagpilot_insight.cli:main"

[tool.setuptools.packages.find]
include = ["tagpilot_insight*"]

[tool.setuptools.package-data]
tagpilot_insight = ["skills/*.yaml", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
