[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagpilot-agent"
version = "0.1.0"
description = "TagPilot agent orchestration backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "langgraph>=1.0,<2", "langchain-core>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tagpilot_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
