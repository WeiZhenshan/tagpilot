[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagpilot-eval"
version = "0.1.0"
description = "TagPilot P0 facts and P1 calibration only"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]
live = ["PyYAML>=6,<7"]

[project.scripts]
tagpilot-eval = "tagpilot_eval.cli:main"

[tool.setuptools.packages.find]
include = ["tagpilot_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
