[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-semantic"
version = "0.1.0"
description = "Tag semantic layer bootstrap and retrieval runtime"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pymilvus>=2.6,<3.1", "jieba==0.42.1", "pyahocorasick>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
models = ["FlagEmbedding>=1.3,<2; python_version < '3.14'"]

[project.scripts]
tag-semantic = "tag_semantic.cli:main"

[tool.pytest.ini_options]
testpaths = ["tag_semantic/tests"]
pythonpath = ["."]
