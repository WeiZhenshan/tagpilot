name: Deploy TagPilot

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tagpilot-production
  cancel-in-progress: true

jobs:

  deploy:

    name: Build and Deploy TagPilot

    runs-on:
      - self-hosted
      - tagpilot-prod

    timeout-minutes: 40

    steps:

      # =========================
      # Checkout
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v7


      # =========================
      # Environment
      # =========================

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version
          free -h
          df -h /


      # =========================
      # Backend
      # =========================

      - name: Build backend
        env:
          MAVEN_OPTS: -Xmx768m
        run: |
          mvn -B clean package -DskipTests

      - name: Check backend artifact
        run: |
          ls -lh ruoyi-admin/target/ruoyi-admin.jar


      # =========================
      # Frontend
      # =========================

      - name: Setup Node.js 16
        uses: actions/setup-node@v7
        with:
          node-version: '16'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: ruoyi-ui
        run: |
          npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: ruoyi-ui
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        run: |
          npm run build:prod


      # =========================
      # Local deploy
      # =========================

      - name: Deploy TagPilot
        shell: bash
        run: |

          set -euo pipefail

          SHA="$GITHUB_SHA"

          RELEASE_DIR="/opt/tagpilot/releases/$SHA"

          echo "Deploying:"
          echo "$SHA"

          PREVIOUS=""

          if [ -L /opt/tagpilot/current ]; then
            PREVIOUS="$(readlink -f /opt/tagpilot/current)"
          fi


          # ---------------------
          # Create release
          # ---------------------

          rm -rf "$RELEASE_DIR"

          mkdir -p "$RELEASE_DIR/ui"

          cp \
            ruoyi-admin/target/ruoyi-admin.jar \
            "$RELEASE_DIR/ruoyi-admin.jar"

          cp -a \
            ruoyi-ui/dist/. \
            "$RELEASE_DIR/ui/"

          chmod -R a+rX "$RELEASE_DIR"


          # ---------------------
          # Switch release
          # ---------------------

          ln -sfn \
            "$RELEASE_DIR" \
            /opt/tagpilot/current


          # ---------------------
          # Restart backend
          # ---------------------

          sudo -n /usr/bin/systemctl restart tagpilot


          # ---------------------
          # Health check
          # ---------------------

          HEALTHY=0

          for i in $(seq 1 30); do

            if curl \
              -fsS \
              http://127.0.0.1:8080/captchaImage \
              >/dev/null 2>&1
            then

              HEALTHY=1
              break

            fi

            echo "Waiting for TagPilot... $i/30"

            sleep 2

          done


          # ---------------------
          # Rollback
          # ---------------------

          if [ "$HEALTHY" -ne 1 ]; then

            echo "TagPilot health check failed."

            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then

              echo "Rollback to:"
              echo "$PREVIOUS"

              ln -sfn \
                "$PREVIOUS" \
                /opt/tagpilot/current

              sudo -n \
                /usr/bin/systemctl restart tagpilot

            fi

            exit 1

          fi


          # ---------------------
          # Cleanup old releases
          # ---------------------

          ls -1dt \
            /opt/tagpilot/releases/* \
            2>/dev/null \
            | tail -n +6 \
            | xargs -r rm -rf


          echo "TagPilot deployment successful."