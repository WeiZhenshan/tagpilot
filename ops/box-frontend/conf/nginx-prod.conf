worker_processes  auto;
error_log  /workspace/tagpilot-data/frontend-prod/logs/error.log warn;
pid        /workspace/tagpilot-data/frontend-prod/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 100m;
    access_log  /workspace/tagpilot-data/frontend-prod/logs/access.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    gzip_min_length 256;
    gzip_static on;

    map $uri $internal_docs {
        default 0;
        "~*^/(dev-api/|prod-api/)?(v[23](;[^/]*)?/api-docs|swagger-ui|swagger-resources|webjars|doc\.html|druid|actuator)(/|$|\.|;)" 1;
    }
    map $uri $static_cache {
        default "no-cache";
        "~*^/(static|js|css)/.*[.-][a-f0-9]{8,}\.(js|css|png|jpg|svg|woff2?)(\.map)?$" "public, max-age=31536000, immutable";
        "~^/agent-ui/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css|png|svg|woff2?)$" "public, max-age=31536000, immutable";
        ~^/(index\.html|agent-ui/($|index\.html)) "no-store";
    }

    upstream tagpilot_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream tagpilot_assistant_dev {
        server 127.0.0.1:5174;
        keepalive 8;
    }


    server {
        listen 8081;
        server_name _;
        root /workspace/tagpilot-data/frontend-prod/current/dist;
        index index.html;
        if ($internal_docs) { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control $static_cache always;

        location ^~ /static/ {
            try_files $uri =404;
        }

        location ~* ^/(js|css|img|fonts|styles)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
            try_files $uri =404;
        }

        location = /index.html {
        }

        location ^~ /dev-api/ {
            proxy_pass http://tagpilot_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        location = /dev-api { return 301 /dev-api/; }

        location ^~ /prod-api/ {
            proxy_pass http://tagpilot_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 660s;
            proxy_send_timeout 660s;
        }
        location = /prod-api { return 301 /prod-api/; }

        location ^~ /profile/ {
            proxy_pass http://tagpilot_backend;
            proxy_set_header Host $host;
        }

        location ^~ /agent-ui/assets/ {
            root /workspace/tagpilot-data/frontend-prod/current/assistant-www;
            try_files $uri =404;
        }
        location = /agent-ui/index.html {
            root /workspace/tagpilot-data/frontend-prod/current/assistant-www;
        }
        location ^~ /agent-ui/ {
            root /workspace/tagpilot-data/frontend-prod/current/assistant-www;
            try_files $uri $uri/ /agent-ui/index.html;
        }
        location = /agent-ui { return 301 /agent-ui/; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
