worker_processes  auto;
error_log  /workspace/tagpilot-data/frontend-prod/logs/error.log warn;
pid        /workspace/tagpilot-data/frontend-prod/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 100m;
    access_log  /workspace/tagpilot-data/frontend-prod/logs/access.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    gzip_min_length 256;
    gzip_static on;

    map $uri $internal_docs {
        default 0;
        "~*^/(dev-api/|prod-api/)?(v[23](;[^/]*)?/api-docs|swagger-ui|swagger-resources|webjars|doc\.html|druid|actuator)(/|$|\.|;)" 1;
    }
    map $uri $static_cache {
        default "no-cache";
        "~*^/(static|js|css)/.*[.-][a-f0-9]{8,}\.(js|css|png|jpg|svg|woff2?)(\.map)?$" "public, max-age=31536000, immutable";
        "~^/agent-ui/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css|png|svg|woff2?)$" "public, max-age=31536000, immutable";
        ~^/(index\.html|agent-ui/($|index\.html)) "no-store";
    }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream tagpilot_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream tagpilot_assistant_dev {
        server 127.0.0.1:5174;
        keepalive 8;
    }


    server {
        listen 8081;
        server_name _;
        if ($internal_docs) { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-store" always;
        location / {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 660s;
        }
    }
}
